<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام البكالوريا</title>
    <link rel="stylesheet" href="تسجيل الدخول.css">
    <script src="تسجيل دخول.js"></script>
    
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">🎓</div>
        <h2>مرحباً بك 👋</h2>
        <p>سجل دخولك لمتابعة حضورك وتقييماتك</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم الطالب:</label>
                <input type="text" id="username" placeholder="أدخل اسمك بالكامل" autocomplete="off">
                <small class="error-msg" id="userError"></small>
            </div>

           <div class="form-group">
                <label for="password">كلمة السر:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة السر">
                    <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
                </div>
                <small class="error-msg" id="passError"></small>
            </div>

           
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">تسجيل الدخول</span>
            </button>
        </form>
    </div>
</body>
</html>
